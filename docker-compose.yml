version: '3.9'

services:
  db:
    image: postgres:16-alpine
    container_name: smart_grocery_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: smart_grocery
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD env variable}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d smart_grocery"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./src/SmartGrocery.Api
      dockerfile: Dockerfile
    container_name: smart_grocery_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=smart_grocery;Username=postgres;Password=${POSTGRES_PASSWORD}"
    ports:
      - "5000:8080"

volumes:
  pg_data:
